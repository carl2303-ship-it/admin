name: restore-queries
on:
  push:
    branches: [cursor/paridade-boost-admin-95eb]
    paths:
      - 'src/lib/boost/.queries.restore.b64'
      - '.github/workflows/restore-queries.yml'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore queries.ts from sidecar if present
        run: |
          set -e
          if [ ! -f src/lib/boost/.queries.restore.b64 ]; then
            echo "No sidecar; skip"
            exit 0
          fi
          python3 - <<'PY'
          import base64, zlib, pathlib
          b64 = pathlib.Path('src/lib/boost/.queries.restore.b64').read_text().strip()
          data = zlib.decompress(base64.b64decode(b64))
          pathlib.Path('src/lib/boost/queries.ts').write_bytes(data)
          print('restored', len(data), 'byCategory' in data.decode())
          PY
          rm -f src/lib/boost/.queries.restore.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/boost/queries.ts
          git add -u src/lib/boost/.queries.restore.b64 || true
          git status
          git commit -m "fix(boost): restore queries.ts from compressed sidecar (byCategory)" || exit 0
          git push
