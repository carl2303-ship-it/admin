name: restore-actions
on:
  push:
    branches: [cursor/ebook-funnel-builder-2a82]
    paths:
      - 'src/lib/boost/.actions.restore.b64.p0'
      - 'src/lib/boost/.actions.restore.b64.p1'
      - 'src/lib/boost/.actions.restore.b64.p2'
      - 'src/lib/boost/.actions.restore.b64.p3'
      - '.github/workflows/restore-actions.yml'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore actions.ts from sidecar parts
        run: |
          set -e
          for i in 0 1 2 3; do
            f="src/lib/boost/.actions.restore.b64.p$i"
            if [ ! -f "$f" ]; then
              echo "Sidecar part missing: $f; skip"
              exit 0
            fi
          done
          python3 - <<'PY'
          import base64, zlib, pathlib, hashlib
          parts = [pathlib.Path(f'src/lib/boost/.actions.restore.b64.p{i}').read_text().strip() for i in range(4)]
          data = zlib.decompress(base64.b64decode(''.join(parts)))
          expected = '847f0bf8fe4b82a438097a181675e7e4a08cb9e31af9326d2d15b1d081c94fb3'
          got = hashlib.sha256(data).hexdigest()
          print('restored', len(data), got)
          assert got == expected, (got, expected)
          text = data.decode()
          assert 'createEbookFunnel' in text
          pathlib.Path('src/lib/boost/actions.ts').write_bytes(data)
          PY
          rm -f src/lib/boost/.actions.restore.b64.p[0-3] src/lib/boost/.actions.restore.b64.part[01] src/lib/boost/.actions.restore.b64 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/boost/actions.ts
          git add -u src/lib/boost/ || true
          git status
          git commit -m "feat(boost): actions/queries/types funis ebook" || exit 0
          git push
