name: restore-actions
on:
  push:
    branches: [cursor/ebook-funnel-builder-2a82]
    paths:
      - 'src/lib/boost/.actions.restore.b64.part0'
      - 'src/lib/boost/.actions.restore.b64.part1'
      - '.github/workflows/restore-actions.yml'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore actions.ts from sidecar parts
        run: |
          set -e
          P0=src/lib/boost/.actions.restore.b64.part0
          P1=src/lib/boost/.actions.restore.b64.part1
          if [ ! -f "$P0" ] || [ ! -f "$P1" ]; then
            echo "Sidecar parts missing; skip"
            exit 0
          fi
          python3 - <<'PY'
          import base64, zlib, pathlib
          p0 = pathlib.Path('src/lib/boost/.actions.restore.b64.part0').read_text().strip()
          p1 = pathlib.Path('src/lib/boost/.actions.restore.b64.part1').read_text().strip()
          data = zlib.decompress(base64.b64decode(p0 + p1))
          pathlib.Path('src/lib/boost/actions.ts').write_bytes(data)
          text = data.decode()
          print('restored', len(data), 'createEbookFunnel' in text, 'deleteEbookFunnelAsset' in text)
          assert 'createEbookFunnel' in text
          PY
          rm -f "$P0" "$P1" src/lib/boost/.actions.restore.b64 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/boost/actions.ts
          git add -u src/lib/boost/.actions.restore.b64.part0 src/lib/boost/.actions.restore.b64.part1 src/lib/boost/.actions.restore.b64 || true
          git status
          git commit -m "feat(boost): actions/queries/types funis ebook" || exit 0
          git push
