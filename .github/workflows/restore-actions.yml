name: restore-actions-ts
on:
  push:
    paths:
      - "scripts/actions.restore.b64"
      - ".github/workflows/restore-actions.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore src/lib/boost/actions.ts from zlib+base64 sidecar
        run: |
          python3 - <<'PY'
          import base64, zlib, pathlib
          raw = pathlib.Path("scripts/actions.restore.b64").read_text().strip()
          data = zlib.decompress(base64.b64decode(raw))
          out = pathlib.Path("src/lib/boost/actions.ts")
          out.write_bytes(data)
          print("restored", out, "bytes", len(data))
          text = data.decode()
          for m in ["generateEbookFunnelLanding", "publishEbookFunnelToStore", "importLegacyPadelIqFunnel"]:
              assert m in text, m
          PY
      - name: Commit restored actions.ts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/boost/actions.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat(funis): restaurar actions.ts monolítico completo (~50KB)"
          git push
