name: restore-actions
on:
  push:
    branches: [cursor/ebook-funnel-builder-2a82]
    paths:
      - 'src/lib/boost/.actions.restore.b64'
      - '.github/workflows/restore-actions.yml'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore actions.ts from sidecar if present
        run: |
          set -e
          if [ ! -f src/lib/boost/.actions.restore.b64 ]; then
            echo "No sidecar; skip"
            exit 0
          fi
          python3 - <<'PY'
          import base64, zlib, pathlib
          b64 = pathlib.Path('src/lib/boost/.actions.restore.b64').read_text().strip()
          data = zlib.decompress(base64.b64decode(b64))
          pathlib.Path('src/lib/boost/actions.ts').write_bytes(data)
          text = data.decode()
          print('restored', len(data), 'createEbookFunnel' in text, 'deleteEbookFunnelAsset' in text)
          PY
          rm -f src/lib/boost/.actions.restore.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/boost/actions.ts
          git add -u src/lib/boost/.actions.restore.b64 || true
          git status
          git commit -m "feat(boost): actions/queries/types funis ebook" || exit 0
          git push
