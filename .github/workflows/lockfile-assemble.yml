name: lockfile-assemble
on:
  workflow_dispatch:
  push:
    paths: ['.github/restore-package-lock/t53.txt']
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          cat .github/restore-package-lock/t{0..53}.txt > package-lock.json
          python3 -c "from pathlib import Path; t=Path('package-lock.json').read_text(); assert t.lstrip().startswith(chr(123)); assert 'node_modules/stripe' in t; assert chr(34)+'version'+chr(34)+': '+chr(34)+'23.1.0'+chr(34) in t; assert 'LOCKFILE_PLACEHOLDER' not in t; print('ok', len(t))"
          git config user.name carl2303-ship-it
          git config user.email carl2303@gmail.com
          git add package-lock.json
          git rm -r --ignore-unmatch .github/restore-package-lock .github/workflows/lockfile-assemble.yml || true
          git commit -m "fix(deps): replace placeholder package-lock with stripe@23.1.0 lock"
          git push
