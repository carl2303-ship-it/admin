[build]
  command = "npm run build"
  # App Router Next.js — o runtime @netlify/plugin-nextjs consome .next
  # (não uses "out" / static export para este shell com SSR + Route Handlers)
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Garante installs reprodutíveis quando package-lock.json está no repo
  NPM_FLAGS = "--prefer-offline --no-audit"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# PWA service worker — sem cache agressivo
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# Cron diário (UTC): renovação SaaS Tour → payment link email
# Função: netlify/functions/saas-renewal-cron.mts
# Requer SAAS_RENEWAL_CRON_SECRET (ou CRON_SECRET) + BOOST_* no site admin.

